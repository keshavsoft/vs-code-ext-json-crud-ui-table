<html>

<body>
    <!-- <button onclick="send('showAll')">ShowAll</button>
    <button onclick="send('showAllWithSerial')">ShowAllWithSerial</button> -->
    <button onclick="showInputs()">ShowWithHeader</button>

    <div id="inputs" style="display:none">
        <input id="tableName" placeholder="Table Name">

        <button onclick="sendWithHeader()">Generate</button>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        function send(action) {
            vscode.postMessage({ action });
        }

        function showInputs() {
            document.getElementById("inputs").style.display = "block";
        }

        function sendWithHeader() {
            vscode.postMessage({
                action: "withHeader",
                tableName: document.getElementById("tableName").value
            });
        }
    </script>

</body>

</html>
