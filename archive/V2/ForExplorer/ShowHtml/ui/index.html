<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,Arial,sans-serif;
background:linear-gradient(135deg,#020617,#0f172a);
color:#e2e8f0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.container{
width:95%;
max-width:700px;
background:#020617;
border:1px solid #1e293b;
border-radius:25px;
padding:45px;
box-shadow:0 10px 40px rgba(0,0,0,.6);
animation:fadeIn .6s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.hero{
text-align:center;
margin-bottom:40px;
}

.hero h1{
font-size:42px;
color:#38bdf8;
margin-bottom:15px;
}

.hero p{
color:#cbd5e1;
font-size:17px;
line-height:1.8;
}

.badges{
margin-top:20px;
}

.badge{
display:inline-block;
padding:8px 14px;
margin:5px;
background:#0f172a;
border:1px solid #1e293b;
border-radius:12px;
color:#38bdf8;
font-size:13px;
}

.card{
background:#0f172a;
padding:30px;
border-radius:20px;
border:1px solid #1e293b;
}

.card h2{
color:#38bdf8;
margin-bottom:20px;
font-size:28px;
}

.input-group{
margin-top:20px;
}

label{
display:block;
margin-bottom:10px;
font-size:15px;
color:#cbd5e1;
}

input{
width:100%;
padding:16px;
background:#020617;
border:1px solid #334155;
border-radius:14px;
color:#e2e8f0;
font-size:16px;
outline:none;
transition:.3s;
}

input:focus{
border-color:#38bdf8;
box-shadow:0 0 10px rgba(56,189,248,.3);
}

.buttons{
margin-top:30px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

button{
flex:1;
min-width:180px;
padding:16px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.primary{
background:#38bdf8;
color:#020617;
}

.primary:hover{
background:#0ea5e9;
transform:translateY(-3px);
}

.secondary{
background:#1e293b;
color:#e2e8f0;
}

.secondary:hover{
background:#334155;
transform:translateY(-3px);
}

.workflow{
margin-top:35px;
background:#020617;
padding:20px;
border-radius:15px;
border:1px solid #1e293b;
}

.workflow h3{
color:#38bdf8;
margin-bottom:15px;
}

.step{
padding:10px 0;
border-bottom:1px solid #1e293b;
font-size:15px;
}

.step:last-child{
border-bottom:none;
}

.highlight{
color:#38bdf8;
font-weight:bold;
}

.footer{
margin-top:30px;
text-align:center;
font-size:14px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

<div class="hero">

</div>

<div class="card">

<h2>⚡ Generate Show All</h2>

<div class="input-group">

<label>Enter Table Name</label>

<input 
id="tableName"
placeholder="Example: Customers"
/>

</div>

<div class="buttons">

<button class="primary" onclick="sendWithHeader()">
🚀 Generate
</button>

<button class="secondary" onclick="clearInput()">
🧹 Clear
</button>

</div>

<div class="workflow">

<h3>🛠️ Workflow</h3>

<div class="step">
1️⃣ Enter <span class="highlight">Table Name</span>
</div>

<div class="step">
2️⃣ Click <span class="highlight">Generate</span>
</div>

<div class="step">
🚀 Generated index.html + Index Fplder + script.js
</div>

</div>

</div>

<div class="footer">

Made with ❤ by KeshavSoft

</div>

</div>

<script>

const vscode = acquireVsCodeApi();

function send(action){
    vscode.postMessage({ action });
}

function sendWithHeader(){

    const tableName = document.getElementById("tableName").value;

    if(!tableName){
        alert("Please enter table name");
        return;
    }

    vscode.postMessage({
        action:"withHeader",
        tableName
    });
}

function clearInput(){
    document.getElementById("tableName").value = "";
}

</script>

</body>

</html>
